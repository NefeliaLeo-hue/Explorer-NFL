<div id="st-am-extension-settings" class="aps-settings-container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b> Explorer-NFL-资源管理</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p>选择管理面板的唤出入口：</p>
            <div style="margin-bottom: 15px;">
                <select id="st-am-entry-mode" class="text_pole" style="width: 100%; box-sizing: border-box;">
                    <option value="both">原生面板 与 魔法棒 同时显示</option>
                    <option value="native">仅在 原生面板(图1/图2) 显示</option>
                    <option value="magic">仅在 魔法棒菜单 显示</option>
                </select>
            </div>
            
            <button id="st-am-test-open-btn" class="menu_button" style="width: 100%; margin-bottom: 10px; border-color: var(--SmartThemeQuoteColor);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: text-bottom; margin-right: 5px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                立刻打开管理面板
            </button>

            <!-- 诊断探针控制区 -->
            <button id="st-am-diag-btn" class="menu_button danger" style="width: 100%; margin-bottom: 10px; background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545;">
                🔍 一键运行环境诊断探针
            </button>
            <textarea id="st-am-diag-output" class="text_pole" style="width: 100%; height: 160px; font-size: 0.75em; font-family: monospace; display: none; box-sizing: border-box; white-space: pre; margin-bottom: 10px;" readonly placeholder="诊断日志将显示在此处..."></textarea>
            
            <hr>
            <button id="st-am-save-btn" class="menu_button">保存设置</button>
        </div>
    </div>
</div>
